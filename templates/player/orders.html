{% extends 'base.html' %}{% block content %}<section class="section"><h1>My Orders</h1><div class="tablewrap"><table><tr><th>Code</th><th>Product</th><th>Category</th><th>Amount</th><th>Date</th><th>Status</th></tr>{% for o in orders %}<tr><td>{{o.verification_code}}</td><td>{{o.product_name}}</td><td>{{o.category}}</td><td>₹{{o.amount}}</td><td>{{o.created_at.strftime('%d %b %Y')}}</td><td><span class="status {{o.status|lower}}">{{o.status}}</span></td></tr>{% else %}<tr><td colspan="6">No orders yet.</td></tr>{% endfor %}</table></div></section>{% endblock %}
