{% extends 'admin/base.html' %}{% block content %}<h1>Orders</h1><form class="filters"><input name="q" placeholder="Username, email, code" value="{{request.args.get('q','')}}"><select name="status"><option value="">All statuses</option>{% for x in ['PENDING','APPROVED','REJECTED'] %}<option {% if request.args.get('status')==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><select name="category"><option value="">All categories</option>{% for x in ['RANK','ITEM','IGM'] %}<option {% if request.args.get('category')==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><button class="btn">Filter</button></form>{% include 'admin/order_table.html' %}{% endblock %}
