<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember Admin</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script></head><body class="adminbody"><aside class="side"><h2>EMBER<br><span>CONTROL</span></h2><a href="{{url_for('admin.dashboard')}}">Dashboard</a><a href="{{url_for('admin.orders')}}">Orders</a><a href="{{url_for('admin.players')}}">Players</a><a href="{{url_for('admin.audit_log')}}">Audit Log</a><form method="post" action="{{url_for('admin.logout')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Logout</button></form></aside><main class="adminmain">{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script>if(window.io){const s=io();s.on('order_update',()=>location.reload())}</script></body></html>
